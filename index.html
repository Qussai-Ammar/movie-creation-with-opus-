<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حنين · Nostalgia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body.idle { cursor: none; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100vw; height: calc(100vw * 804 / 1920); background: #000; }
  @media (min-aspect-ratio: 1920/804) { canvas { height: 100vh; width: calc(100vh * 1920 / 804); } }

  #start {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #cfc6b8; background: #000; cursor: pointer; transition: opacity 1.4s ease; font-family: Georgia, 'Times New Roman', serif;
  }
  #start.gone { opacity: 0; pointer-events: none; }
  #start h1 { font-family: Amiri, 'Noto Naskh Arabic', 'Geeza Pro', serif; font-weight: normal; font-size: clamp(40px, 7vw, 84px); margin: 0 0 .1em; }
  #start .en { font-family: Georgia, serif; letter-spacing: .6em; padding-left: .6em; font-size: 12px; opacity: .6; margin: 0 0 1.2em; }
  #start .by { font-family: Amiri, 'Noto Naskh Arabic', serif; font-size: 18px; letter-spacing: 0; text-transform: none; opacity: .7; margin: 0 0 2.2em; }
  #start p { font-family: system-ui, sans-serif; font-size: 12px; letter-spacing: .25em; text-transform: uppercase; opacity: .5; margin: .45em; }
  #start .go { opacity: .85; border: 1px solid rgba(207, 198, 184, .35); padding: .9em 2.2em; margin-bottom: 1.6em; }

  #hud {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 14px; color: #bdb6ab;
    font: 12px/1.4 system-ui, sans-serif; background: linear-gradient(transparent, rgba(0, 0, 0, .8));
    opacity: 0; transition: opacity .5s ease; user-select: none;
  }
  #hud.show { opacity: 1; }
  #row { display: flex; justify-content: space-between; gap: 12px; }
  #bar { position: relative; height: 20px; margin: 6px 0 4px; cursor: pointer; }
  #bar .track { position: absolute; left: 0; right: 0; top: 9px; height: 2px; background: rgba(255, 255, 255, .16); }
  #bar .fill { position: absolute; left: 0; top: 9px; height: 2px; background: #d9b27a; }
  #bar .tick { position: absolute; top: 5px; width: 1px; height: 10px; background: rgba(255, 255, 255, .3); }
  #keys { opacity: .45; }
</style>
</head>
<body>
<div id="stage"><canvas id="film"></canvas></div>

<div id="hud">
  <div id="row"><span id="scn"></span><span id="tm"></span></div>
  <div id="bar"><div class="track"></div><div class="fill"></div></div>
  <div id="keys">space play / pause · ← → seek 5 s · 1–9, 0, −, = jump to scene · F fullscreen · M mute</div>
</div>

<div id="start">
  <h1>حنين</h1>
  <p class="en">NOSTALGIA</p>
  <p class="by" dir="rtl">فيلم من إخراج قصي أنس</p>
  <p class="go">click to begin</p>
  <p>no dialogue · original score</p>
  <p>headphones recommended</p>
</div>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/characters.js"></script>
<script src="js/anime.js"></script>
<script src="js/sets.js"></script>
<script src="js/post.js"></script>
<script src="js/scenes/s00_title.js"></script>
<script src="js/scenes/s01_bedroom.js"></script>
<script src="js/scenes/s02_falling_asleep.js"></script>
<script src="js/scenes/s03_drowning.js"></script>
<script src="js/scenes/s04_corridor.js"></script>
<script src="js/scenes/s05_coffee_cup.js"></script>
<script src="js/scenes/s06_mother.js"></script>
<script src="js/scenes/s07_waking.js"></script>
<script src="js/scenes/s08_bathroom.js"></script>
<script src="js/scenes/s09_leaving.js"></script>
<script src="js/scenes/s09b_work.js"></script>
<script src="js/scenes/s10_balloon.js"></script>
<script src="js/scenes/s11_final.js"></script>
<script src="js/music.js"></script>
<script>FILM.boot();</script>
</body>
</html>
